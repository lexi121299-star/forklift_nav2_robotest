fine_motion_adapter:
  ros__parameters:
    action_name: /forklift/fine_motion/move_relative
    pivot_action_name: /forklift/fine_motion/pivot_relative
    odom_topic: /odom
    vehicle_state_topic: /forklift/vehicle_state
    command_topic: /forklift/control_cmd_raw
    control_rate_hz: 20.0
    odom_timeout_sec: 0.5
    vehicle_state_timeout_sec: 0.5
    # Allow a temporary obstacle to clear while the safety gate continues to
    # suppress motion immediately.
    progress_timeout_sec: 60.0
    default_goal_timeout_sec: 60.0
    max_speed_mps: 0.15
    distance_tolerance_m: 0.02
    progress_epsilon_m: 0.005
    max_lateral_deviation_m: 0.10
    max_heading_change_rad: 0.15
    max_start_steering_angle_rad: 0.10
    steering_center_timeout_sec: 3.0
    accel_time_sec: 1.0
    decel_time_sec: 1.0
    pivot_max_speed_mps: 0.12
    pivot_final_speed_mps: 0.06
    pivot_steering_angle_rad: 1.5707963267948966
    pivot_yaw_tolerance_rad: 0.05
    pivot_progress_epsilon_rad: 0.01
    pivot_step_angle_rad: 0.3490658503988659
    pivot_step_hold_sec: 0.0
    pivot_final_slowdown_angle_rad: 0.3490658503988659
    pivot_wrong_direction_tolerance_rad: 0.08
    pivot_timeout_sec: 60.0
