xfl201_vehicle_interface:
  ros__parameters:
    dry_run: false
    can_interface: can0
    command_timeout_sec: 0.5
    control_rate_hz: 20.0
    feedback_poll_rate_hz: 50.0
    state_publish_rate_hz: 20.0
    # Supplier heartbeat/watchdog window is 200 ms; we transmit at 20 Hz (50 ms).
    feedback_timeout_sec: 0.25
    publish_tf: true
    odom_frame_id: odom
    base_frame_id: base_link

    # Supplier confirmed XFL201 is steered, not differential:
    # steering angle must be sent; left/right RPM are travel-speed commands.
    # Supplier confirmed: wheel diameter 450 mm, drive gear ratio 26.75.
    drive_wheel_radius_m: 0.225
    drive_gear_ratio: 26.75
    drive_wheel_base_m: 1.47

    # Initial odometry scale for 0x209/0x20A.
    # Assumption until field calibration: counters are motor-side encoder counts
    # at 1024 counts/rev, so meter_per_pulse = pi*0.45/(26.75*1024).
    left_meter_per_pulse: 0.000051610568564376714
    right_meter_per_pulse: 0.000051610568564376714
    left_encoder_sign: 1.0
    right_encoder_sign: 1.0

    # TODO field confirm: XFL201 protocol says body positive is fork reverse.
    body_positive_is_fork_reverse: true
    left_motor_sign: 1.0
    right_motor_sign: 1.0

    max_motor_rpm: 3000.0
    # Supplier: minimum low speed is 30 rpm, minimum stable travel is 100 rpm.
    min_motor_rpm: 100.0
    # Supplier: current max accel/decel response is configured as about 1 s.
    rpm_accel_time_sec: 1.0
    rpm_decel_time_sec: 1.0
    # Supplier: no brake option; stop/emergency stop is RPM=0.
    max_brake_force: 0
    normal_brake_force: 0
    send_fork_stop_frame: false

    # Straight travel uses 0 deg. At +/-90 deg the vehicle rotates around its
    # steering center; it cannot counter-rotate in place like a differential base.
    use_command_steering_angle: true
    steering_angle_fixed_deg: 0.0
    pivot_steering_angle_rad: 1.5707963267948966
    # Wa=1.743 m is an outer-envelope turning radius placeholder until
    # low-speed XFL201 calibration provides the effective pivot radius.
    pivot_turn_radius_m: 1.743
    pivot_center_x_offset_m: 0.0

    max_integration_dt_sec: 0.20
    max_rx_frames_per_cycle: 32
