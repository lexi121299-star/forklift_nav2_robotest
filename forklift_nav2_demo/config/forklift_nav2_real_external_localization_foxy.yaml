amcl:
  ros__parameters:
    # Real-vehicle mode assumes the localization stack owns map -> odom.
    # Keep AMCL available for Nav2 bringup compatibility, but do not let it
    # publish a second map -> odom transform.
    use_sim_time: false
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "differential"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: false
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

amcl_map_client:
  ros__parameters:
    use_sim_time: false

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_bt_xml_filename: "/workspace/install/forklift_nav2_demo/share/forklift_nav2_demo/behavior_trees/forklift_oru_plan_once_with_recovery.xml"
    bt_loop_duration: 10
    # The 5861 x 2611 global costmap can take hundreds of milliseconds to
    # clear. Foxy's 20 ms default caused the recovery service itself to fail.
    default_server_timeout: 2000
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "general_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      # A maximum-angle pivot plus steering return can legitimately exceed the
      # default window without translating 0.2 m.
      # Keep the active plan while a temporary aisle obstruction clears.  The
      # safety gate continues to block motion immediately; this only delays
      # Nav2's no-progress failure/recovery transition.
      movement_time_allowance: 300.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Match the controller terminal tolerance. The 2026-08-27 run consumed
      # its path at 0.281 m, then replanned a needless 96 degree pivot for the
      # final few centimetres.
      xy_goal_tolerance: 0.30
      # Production pickup/navigation goals are position goals. Do not turn the
      # steering through large angles after the vehicle reaches the target point.
      yaw_goal_tolerance: 3.141592653589793

    # Forklift MPC controller parameters
    FollowPath:
      plugin: "forklift_nav2_plugins/ForkliftMpcController"
      # 2MKC20M30LV205 drawing: drive axle to support/steering axle is 1.400 m.
      wheel_base: 1.4
      # The latest straight-line run tracked 0.45 m/s cleanly. Raise the
      # cruise limit slightly while keeping the existing curve/obstacle limits.
      max_velocity: 0.47
      # Deprecated compatibility parameter. Runtime max_velocity is the direct
      # low-curvature reference; all other profiles only reduce that value.
      straight_cruise_speed_mps: 2.00
      min_velocity: 0.09
      max_reverse_velocity: 0.15
      max_steering_angle: 1.5707963267948966
      # computeVelocityCommands runs at 20 Hz while the prediction step is
      # 0.2 s. The model rate limit bounds successive steering targets and
      # reduces delayed left/right over-correction.
      # Keep the predicted steering slew below the measured actuator response.
      # This prevents rapid left/right reversals after a high-speed corner.
      max_steering_angle_velocity: 0.12
      max_acceleration: 0.5
      # Bounded command lead allows actuator lag/deadband without resetting
      # the command ramp to measured feedback on every controller tick.
      command_feedback_allowance_sec: 0.5
      max_angular_velocity: 0.8
      allow_pivot_turn: true
      pivot_steering_angle: 1.5707963267948966
      pivot_steering_tolerance: 0.03
      pivot_turn_radius: 0.6
      # Real vehicle base_link is defined at the drive/rear axle center.
      rear_axle_x_offset: 0.0
      # Vehicle-interface odometry now corrects yaw independently. Keep pivot
      # commands in the same yaw convention as the controller and global pose.
      invert_pivot_yaw_direction: false
      # Pivot is a real vehicle maneuver. Use a conservative cruise speed and
      # a tighter final yaw threshold than the previous 2.86 degree tolerance.
      pivot_velocity: 0.10
      pivot_yaw_tolerance: 0.025
      # Do not leave pivot on a single in-tolerance localization sample. Hold
      # zero traction until odom yaw and yaw rate are stable, then permit one
      # low-speed corrective turn before handing a small residual to MPC.
      pivot_yaw_rate_tolerance: 0.03
      pivot_yaw_settle_duration_sec: 0.30
      # Legacy parameter retained for config compatibility; predictive braking
      # now determines when a correction may start.
      pivot_reacquire_yaw_tolerance: 0.05
      pivot_max_corrections: 1
      # Effective stop model from the 908 bags; calibrate against measured yaw.
      # The 100 RPM floor means lowering pivot_velocity alone may not slow it.
      pivot_brake_reaction_time_sec: 0.30
      pivot_brake_deceleration_radps2: 0.20
      pivot_brake_margin_rad: 0.01
      primitive_brake_reaction_time_sec: 0.50
      primitive_brake_deceleration_mps2: 0.50
      pivot_entry_lateral_tolerance_m: 0.15
      pivot_stop_velocity_threshold: 0.02
      # Capture the planned pivot despite normal real-vehicle lateral tracking
      # error. In the 2026-08-28 14:29 run the closest approach was 0.315 m, so
      # the old 0.20 m threshold was missed and the vehicle drove past it.
      pivot_activation_distance: 0.35
      # Keep the pivot continuous; predictive braking stops the final rotation.
      pivot_step_enabled: false
      pivot_step_angle: 0.3490658503988659
      pivot_step_hold_duration_sec: 0.2
      pivot_step_yaw_tolerance: 0.035
      pivot_wrong_direction_tolerance: 0.08
      # Request lower speed inside 30 degrees. The motor RPM floor may clip
      # this request; predictive braking uses measured rate regardless.
      pivot_final_slowdown_angle: 0.5235987755982988
      pivot_final_velocity: 0.05
      post_pivot_capture_enabled: false
      post_pivot_capture_distance_m: 0.30
      post_pivot_capture_speed_mps: 0.20
      post_pivot_capture_heading_tolerance: 0.04
      # Pivot translation may leave a small path offset. Capture it first;
      # recovery completion below keeps the stricter 0.05 m tolerance.
      post_pivot_capture_lateral_tolerance_m: 0.50
      post_pivot_steering_settle_duration_sec: 0.20
      # If the pivot used its corrective-turn budget, continue the existing
      # route at a bounded speed while MPC restores heading and lateral alignment.
      post_pivot_recovery_enabled: false
      post_pivot_recovery_speed_mps: 0.30
      post_pivot_recovery_max_speed_mps: 0.50
      # After this measured-motion budget, return control to normal Frenet MPC;
      # safety waits do not consume the budget and the route is not aborted.
      post_pivot_recovery_timeout_sec: 20.0
      post_pivot_recovery_steering_limit_rad: 0.35
      post_pivot_recovery_heading_tolerance: 0.05
      post_pivot_recovery_max_heading_error: 0.15
      post_pivot_recovery_lateral_tolerance_m: 0.25
      post_pivot_recovery_settle_duration_sec: 0.15
      # Pivot completion is latched before steering return, so yaw jitter cannot
      # command another +/-90 degree turn. Keep the extra stop short; steering
      # return already provides the main settling time.
      post_pivot_hold_duration_sec: 0.3
      # Hard output acceleration limiting replaces the additional timed ramp.
      post_pivot_slowdown_duration_sec: 0.0
      post_pivot_initial_max_speed: 0.12
      # A new goal can arrive with steering left over from a failed route.
      # Recenter while stopped before allowing the MPC to drive.
      new_goal_steering_settle_enabled: true
      new_goal_steering_tolerance: 0.08
      new_goal_steering_hold_duration_sec: 0.2
      # A continuous B-spline can pass through a small steering reference
      # between consecutive bends. Do not stop and recenter there: ordinary
      # Frenet MPC keeps following the route reference through a doorway/S bend.
      curve_exit_steering_settle_enabled: false
      curve_exit_reference_max_angle_rad: 0.12
      curve_exit_steering_enter_error_rad: 0.20
      curve_exit_steering_reference_drop_rad: 0.10
      curve_exit_steering_tolerance_rad: 0.05
      curve_exit_steering_settle_duration_sec: 0.20
      curve_exit_recovery_distance_m: 0.50
      curve_exit_recovery_max_speed_mps: 0.20
      curve_exit_recovery_timeout_sec: 8.0
      curve_exit_recovery_settle_duration_sec: 0.30
      curve_exit_recovery_heading_tolerance_rad: 0.08726646259971647
      curve_exit_recovery_lateral_tolerance_m: 0.12
      horizon_time: 1.8
      time_step: 0.2
      # Maximum dynamic preview distance. The controller chooses an arc-length
      # window from current speed, acceleration and horizon instead of using a
      # fixed number of 0.05 m samples.
      lookahead_distance: 2.0
      preview_min_distance: 0.75
      tracking_preview_min_distance_m: 3.80
      profile_preview_design_speed_mps: 1.90
      preview_distance_margin: 0.30
      preview_max_distance_m: 6.0
      preview_time_sec: 2.0
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 3.141592653589793
      transform_tolerance: 0.2
      # Begin target braking before the same runup/staging pose; this does not
      # move the pallet maneuver geometry or its final 0.30 m stop clearance.
      terminal_slowdown_distance: 1.2
      # If the preview cursor reaches the final sample a few centimetres early,
      # keep creeping toward the goal instead of holding zero forever.
      terminal_approach_enabled: true
      terminal_approach_max_speed: 0.06
      terminal_approach_max_distance: 0.30
      terminal_approach_heading_tolerance: 0.35
      # Terminal latch must be no looser than the controller's own terminal
      # tolerance.  A 0.25 m latch can stop FollowPath before Nav2 observes the
      # goal as reached, leaving the action active and turning later goals into
      # preemption requests against a controller that is still latched.
      goal_latch_enabled: true
      goal_latch_xy_tolerance: 0.30
      goal_latch_yaw_tolerance: 3.141592653589793
      velocity_samples: 8
      steering_samples: 11
      preview_window_points: 15
      allow_reverse: true
      use_mpc_solver: true
      use_collision_check: true
      # The independent C++ Safety Gate performs the authoritative raw-scan
      # pivot sweep. The local costmap contains this vehicle's fixed body echo,
      # so do not let the controller duplicate that false pivot collision.
      pivot_costmap_collision_check_enabled: false
      allow_unknown: true
      preprocess_path: true
      # The bounded Reeds-Shepp/lattice fallback may emit a swept-footprint-
      # validated stop-pivot-go boundary when no continuous curve exists.
      # Execute it with the controller's existing pivot state machine instead
      # of rejecting an otherwise feasible route before the vehicle moves.
      reject_pivot_paths: false
      respect_reverse_path_orientation: true
      trajectory_resample_spacing: 0.05
      # The planner already returns a validated continuous trajectory. The
      # controller only performs arc-length resampling and must not reshape it.
      trajectory_smoothing_iterations: 0
      trajectory_smoothing_corner_cut_ratio: 0.25
      sharp_turn_warning_angle: 0.7853981633974483
      minimum_turning_radius: 0.60
      curvature_slowdown_enabled: true
      curvature_slowdown_lateral_accel: 0.60
      max_lateral_jerk_mps3: 0.80
      max_longitudinal_acceleration_mps2: 0.50
      planned_deceleration_mps2: 0.50
      minimum_controllable_speed_mps: 0.09
      steering_profile_window_m: 0.30
      drive_track_width_m: 0.937
      drive_wheel_radius_m: 0.2285
      drive_gear_ratio: 26.75
      max_drive_rpm: 2485.0
      min_curvature_speed: 0.09
      # Convert steering-reference change per meter into a feasible speed using
      # the measured steering actuator rate, and anticipate the return by 0.75 m.
      steering_rate_slowdown_enabled: true
      steering_rate_speed_margin: 0.60
      steering_rate_lookahead_distance_m: 0.75
      # Reduce speed continuously through large turns. The old binary heading
      # threshold could jump directly from 0.06 to 0.47 m/s while the steering
      # wheel was still near its limit, causing the post-turn oscillation seen
      # in the 2026-08-21 16:01 test.
      # At 0.70 m/s, start limiting before a visible path-heading error grows
      # into a left/right correction cycle. Full alignment remains continuous.
      heading_slowdown_threshold: 0.20
      heading_slowdown_full_error: 0.45
      heading_alignment_max_speed: 0.20
      steering_slowdown_enabled: true
      # The previous 0.25 rad threshold did not protect the 0.10-0.25 rad
      # residual steering range that caused post-turn weaving on the vehicle.
      steering_slowdown_start_angle: 0.08
      steering_slowdown_full_angle: 0.30
      # Curved motion is still capped by curvature and steering-rate profiles.
      # Do not additionally force every >=0.30 rad turn down to 0.25 m/s;
      # that made a feasible curve crawl despite a higher trajectory reference.
      steering_slowdown_max_speed: 0.45
      # Do not outrun the physical steering actuator when curve curvature falls
      # quickly. Large measured-vs-reference steering lag is held to crawl speed
      # until the wheel catches the local Frenet reference.
      steering_reference_tracking_tolerance: 0.05
      steering_reference_tracking_full_error: 0.20
      steering_reference_tracking_max_speed: 0.20
      # Do not accelerate while Frenet cross-track error is still growing.
      # The 15:13 bag reached 0.40 m/s after error had already exceeded 0.5 m.
      cross_track_slowdown_threshold_m: 0.60
      cross_track_slowdown_full_error_m: 0.75
      cross_track_recovery_max_speed_mps: 0.15
      # The 920 replay showed this emergency recovery staying active while
      # cross-track error kept increasing. Keep its implementation available
      # for diagnostics, but use the unified MPC cost as the default controller.
      cross_track_steering_recovery_enabled: false
      cross_track_steering_recovery_threshold_m: 0.20
      cross_track_steering_recovery_lateral_gain: 0.65
      cross_track_steering_recovery_heading_gain: 1.00
      cross_track_steering_recovery_max_angle_rad: 0.40
      cross_track_steering_recovery_max_speed_mps: 0.35
      cross_track_steering_recovery_max_rate_radps: 0.18
      max_path_deviation: 0.75
      # A sampled command is executed for one controller cycle, not held for
      # the complete 1.8 s scoring horizon. Near-term collisions remain hard
      # rejects; later constant-steering collisions receive maximum cost.
      hard_collision_prediction_horizon_sec: 0.60
      candidate_score_abort_ratio: 4.0
      candidate_score_abort_margin: 100.0
      # Candidate score varies with curvature and preview geometry. It is a
      # diagnostic metric, not a route-wide failure criterion. Collision,
      # path-deviation and Safety Gate protection stay enabled.
      candidate_score_abort_cycles: 0
      safety_gate_enabled: true
      safety_emergency_stop_active: false
      # The controller caps speed from obstacle clearance with
      # d = v * reaction + v^2 / (2 * braking) + clearance.  The 8 m
      # lookahead is also the required range for the raw-scan safety gate.
      safety_stop_distance: 0.50
      safety_slowdown_distance: 8.00
      safety_min_speed: 0.05
      safety_sample_spacing: 0.05
      safety_reaction_time_sec: 0.90
      safety_brake_deceleration_mps2: 1.50
      safety_clearance_m: 0.50
      # The global planner penalizes inflation touched by the complete footprint
      # and rejects lethal cost 254. At execution time, treat cost 253 as a
      # clearance warning rather than a physical collision so a vehicle already
      # touching that band can follow the validated escape route. Lethal cost
      # 254, unknown space, and the full footprint prediction remain blocked by
      # both the MPC controller and the independent gate.
      safety_collision_cost_threshold: 254
      collision_cost_threshold: 254
      # Task Manager activates this heartbeat only near the selected pallet.
      # While active, allow the MPC trajectory through cost 253 inflation;
      # lethal cost 254 remains blocked and the independent Safety Gate still
      # validates the selected pallet rectangle.
      pallet_exemption_enabled: true
      pallet_exemption_active_topic: "/forklift/pallet_approach/exemption_active"
      pallet_exemption_timeout_sec: 0.5
      pallet_exemption_cost_threshold: 254
      # Q-like Frenet state weights. Favor recovering lateral and heading
      # error over holding the nominal steering reference when the vehicle is
      # already off a curve. path_distance_weight is the legacy alias.
      path_distance_weight: 36.0
      lateral_error_weight: 36.0
      longitudinal_error_weight: 0.2
      # At high speed, prefer returning to the road-going steering reference
      # instead of keeping a residual steering correction after a pivot/curve.
      steering_reference_weight: 4.0
      # Keep the first executable steering command near the curvature at the
      # current Frenet projection. This prevents early steering unwind at the
      # start of a tight but continuously changing curve.
      immediate_steering_reference_weight: 10.0
      local_goal_weight: 14.0
      global_goal_weight: 2.0
      heading_weight: 12.0
      obstacle_weight: 12.0
      smoothness_weight: 4.0
      # Penalize rapid absolute steering target changes. The controller also
      # uses measured steering feedback below, so this damps corrections based
      # on what the steering actuator has actually reached.
      steering_change_weight: 100.0
      velocity_reward_weight: 1.2
      # Track the time-parameterized curve speed. Existing curvature, heading,
      # cross-track and steering gates still lower this reference before turns.
      velocity_reference_weight: 10.0
      acceleration_weight: 2.0
      # Keep the drive-axle Frenet error primary. This low-weight preview term
      # discourages the +X steering axle from cutting outside the next curve.
      steering_axle_preview_enabled: true
      steering_axle_offset_m: 1.40
      steering_axle_lateral_weight: 3.0
      publish_control_cmd: true
      control_cmd_topic: "/forklift/control_cmd_raw"
      # Anchor-mode goals still stop at an independent Nav2 endpoint. A modest
      # command ramp removes the harsh restart without changing the planned
      # trajectory, cruise-speed limit, or safety-stop behavior.
      control_cmd_accel_time: 0.45
      control_cmd_decel_time: 0.45
      # Real-vehicle steering is position-controlled and has visible lag. Use
      # the measured angle instead of treating the previous command as reached.
      use_steering_feedback: true
      steering_feedback_topic: "/forklift/vehicle_state"
      steering_feedback_timeout_sec: 0.5

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      # Real vehicle: keep the rolling local costmap and controller pose in the
      # continuous odom frame. The external localization stack owns map -> odom;
      # the global planner remains in map. This prevents localization corrections
      # from jumping local control.
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 18
      height: 18
      resolution: 0.05
      transform_tolerance: 0.5
      # 2MKC20M30LV205 envelope in base_link: drive axle at x=0, forks toward
      # -X. Axle-to-fork-tip=0.370+1.220=1.590 m; rear extent=1.709 m.
      footprint: "[[1.709, 0.610], [1.709, -0.610], [-1.590, -0.610], [-1.590, 0.610]]"
      # The physical footprint already matches the measured vehicle envelope.
      # Do not add a second geometric expansion in Nav2; raw scan protection
      # and lethal full-footprint checks remain enabled.
      footprint_padding: 0.00
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Keep enough local gradient for smooth steering while allowing the
        # verified vehicle envelope to use a narrow doorway.
        inflation_radius: 0.30
        cost_scaling_factor: 7.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: false
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # Match the local costmap and safety gate footprint. Do not use the old
      # small global footprint, otherwise the planner may route too close to racks.
      footprint: "[[1.709, 0.610], [1.709, -0.610], [-1.590, -0.610], [-1.590, 0.610]]"
      footprint_padding: 0.00
      resolution: 0.05
      track_unknown_space: true
      # Do not mark /scan observations into the global costmap. A global grid
      # does not decay cells simply because the vehicle has driven beyond laser
      # range, so a one-time return can block later plans kilometres of time
      # later. Keep global planning static; the rolling local costmap and the
      # raw-scan safety gate retain real-time obstacle protection.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.50
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: false
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/workspace/map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # Planning is request driven. The topology search for a factory-scale map
    # takes about 1-2 seconds, so 20 Hz only produces a misleading warning and
    # has no relationship to the 20 Hz controller loop.
    expected_planner_frequency: 0.5
    use_sim_time: false
    planner_plugins: ["GridBased", "TopologyOnly", "TopologyContinuous"]
    GridBased:
      plugin: "forklift_nav2_plugins/OruGlobalPlanner"
      topology_only: false
      allow_unknown: true
      use_diagonal: true
      prevent_corner_cutting: true
      use_footprint_collision_check: true
      # Full-footprint collision checks distinguish the inflation warning band
      # (253) from a physical lethal obstacle (254). This lets a vehicle already
      # inside the warning band pivot/leave when its swept body does not touch a
      # lethal cell, matching the controller and independent Safety Gate.
      footprint_collision_cost_threshold: 254
      lethal_cost_threshold: 254
      # Hand-drawn warehouse road centerlines are a soft preference only.
      # Static-map and complete-footprint checks remain authoritative.
      route_guidance_enabled: true
      route_guidance_file: "/workspace/src/forklift_nav2_demo/config/warehouse_route_guidance.csv"
      route_guidance_influence_width_m: 2.0
      route_guidance_off_route_cost_multiplier: 0.60
      # While a pallet task navigates to staging, the clicked pallet pose is a
      # temporary obstacle even though the global costmap intentionally remains
      # static. The same heartbeat switches from keepout to exemption only for
      # the final low-speed reverse approach.
      pallet_keepout_enabled: true
      pallet_keepout_pose_topic: "/forklift/pallet_approach/exemption_pose"
      pallet_exemption_active_topic: "/forklift/pallet_approach/exemption_active"
      pallet_keepout_timeout_sec: 0.5
      pallet_keepout_length_m: 1.80
      pallet_keepout_width_m: 1.60
      pallet_keepout_padding_m: 0.10
      cost_travel_multiplier: 2.0
      # Penalize the highest inflation cost touched by the complete footprint,
      # not only the base_link center cell. This moves A* away from racks while
      # keeping cost 253 traversable when no wider route exists.
      footprint_cost_travel_multiplier: 30.0
      unknown_cost_penalty: 5.0
      start_tolerance: 1.2
      goal_tolerance: 1.5
      max_iterations: 0
      # Remove 0.05 m grid zigzags only when the complete straight segment is
      # traversable for the configured forklift footprint.
      astar_path_smoothing_enabled: true
      astar_shortcut_max_lookahead: 400
      # The complete padded footprint is checked at every sample, so cost 253
      # may be used as clearance while lethal cost 254 remains forbidden.
      astar_shortcut_cost_threshold: 254
      # Prefer clearance during A*, but permit full-footprint shortcuts through
      # the 253 warning band. Lethal cost 254 and unknown space remain hard
      # rejections, avoiding unnecessary anchor splits in open diagonal aisles.
      astar_preferred_footprint_cost_threshold: 254
      astar_start_clearance_relax_distance: 1.25
      # Convert the sparse A* anchors into a continuous-curvature path. The
      # first tangent follows the measured vehicle yaw, so an A* corner cannot
      # be mistaken for a +/-90 degree pivot command by the controller.
      astar_bspline_smoothing_enabled: true
      astar_bspline_sample_spacing: 0.05
      astar_bspline_min_turning_radius: 0.60
      astar_bspline_start_tangent_distance: 1.20
      astar_bspline_anchor_spacing: 1.25
      # If a sparse shortcut's B-spline cuts into a rack, add original A* anchors
      # only around the failed sample. Curvature failure advances to fallback.
      astar_bspline_retry_count: 8
      astar_reeds_shepp_fallback_enabled: true
      # A large start-heading mismatch is an explicit stop-pivot-go maneuver,
      # not a high-curvature road corner. The complete rotating footprint is
      # checked before the two same-position yaw poses are emitted.
      astar_start_pivot_enabled: true
      # Prefer the continuous curve. Pivot is only a reachability fallback if
      # the start curve cannot satisfy the vehicle's minimum turning radius.
      astar_start_pivot_preferred: false
      astar_start_pivot_threshold: 0.7853981634
      astar_pivot_collision_sample_angle: 0.0872664626
      # A valid grid route must not be discarded only because one global
      # B-spline leaves its free-space corridor. Fall back to validated straight
      # motion blocks joined by explicit, swept-footprint-checked pivots.
      astar_segmented_fallback_enabled: true
      # Prefer validated straight motion blocks joined by explicit pivots on
      # the real vehicle. This avoids spending seconds on global B-spline and
      # departure retries for routes that are naturally segmented.
      astar_prefer_segmented_path: false
      astar_segmented_pivot_threshold: 0.15
      # A multi-pivot route is hard to execute reliably at a doorway. Reject
      # it here so Task Manager can follow sparse TopologyOnly anchors.
      astar_max_automatic_pivots: 1
      # Remove only a sharp terminal dogleg after the path is already inside
      # the 0.30 m controller goal tolerance. Straight final approaches still
      # run to the selected goal, while tiny endpoint pivots are avoided.
      astar_goal_endpoint_tolerance: 0.28
      # If the current footprint cannot rotate safely, first drive straight in
      # the measured vehicle heading and retry A* from an open pivot staging
      # pose. This supports multi-turn routes around a nearby rack or pillar.
      astar_departure_fallback_enabled: true
      astar_departure_min_distance: 0.50
      astar_departure_max_distance: 5.00
      # Kept for backward-compatible parameter files. Runtime fallback now
      # checks exactly max, midpoint and min distance under one total deadline.
      astar_departure_step_distance: 0.25
      # 1.0 m is adequate for a global connectivity check but too coarse to
      # feed B-spline trajectory generation at doors. 0.50 m remains bounded
      # on this map and preserves the turn geometry needed by GridBased.
      planner_total_timeout_sec: 8.0
      astar_coarse_topology_search_enabled: true
      topology_search_resolution_m: 0.50
      # If an A* corner cannot pivot because the rotating full body would hit
      # a rack or pallet, move the pivot backward into the inbound aisle,
      # reserve a straight exit, then re-plan from that exit. Candidates are
      # searched far-to-near so a clear corridor position wins over a corner.
      astar_internal_pivot_relocation_enabled: false
      astar_internal_pivot_min_distance: 0.75
      astar_internal_pivot_max_distance: 4.00
      astar_internal_pivot_step_distance: 0.25
      astar_internal_pivot_exit_distance: 0.75
      # Keep the final path heading aligned with the approach segment. RViz goal
      # yaw is intentionally ignored so reaching the point cannot trigger a
      # large terminal steering/pivot maneuver.
      use_final_approach_orientation: false
      use_lattice_planner: false
      # v1 fail-safe: when the kinodynamic lattice search finds no path, fail cleanly
      # (PlannerException) instead of handing a holonomic 2D-A* path to the forklift
      # controller. A* ignores heading/kinematics, so the controller could not track it
      # and the vehicle diverged to the wrong corner. Re-routing is deferred to P10; v1
      # runs fixed, pre-validated routes and stops/aborts safely on planning failure.
      lattice_fallback_to_astar: true
      lattice_heading_bins: 16
      # This is the kinodynamic primitive step length in meters, not the map
      # resolution. Keep 0.20 m with 0.05 m maps unless validation shows it is
      # too coarse for a specific aisle geometry.
      lattice_step_distance: 0.20
      lattice_arc_radius: 0.60
      # Multi-curvature catalog. The tight/default/wide radii all terminate on
      # the configured heading bins; the smallest radius is also used by the
      # Reeds-Shepp analytic expansion.
      lattice_arc_radii: [0.60, 0.90, 1.20]
      lattice_arc_angle: 0.3926990817
      lattice_primitive_samples: 5
      lattice_reverse_enabled: true
      lattice_goal_tolerance: 0.25
      lattice_turn_cost_multiplier: 0.25
      lattice_obstacle_cost_multiplier: 1.0
      lattice_goal_heading_cost_multiplier: 0.25
      lattice_reverse_cost_multiplier: 1.5
      lattice_gear_switch_cost: 2.0
      lattice_reverse_requires_goal_behind: true
      lattice_reverse_goal_behind_margin: 0.05
      lattice_pivot_enabled: false
      lattice_pivot_angle: 0.3926990817
      lattice_pivot_turn_cost: 2.0
      lattice_rear_axle_x_offset: 0.0
      # Near the goal with a large remaining heading error, fix heading by pivot only
      # and suppress reverse so terminal nudges do not destabilise the controller.
      lattice_pivot_terminal_radius: 0.6
      lattice_pivot_terminal_heading: 0.7853981634  # pi/4 = 45 deg
      # Reeds-Shepp goal shot. Every sample still passes costmap + footprint checks.
      lattice_analytic_expansion_enabled: true
      lattice_analytic_expansion_radius: 3.0
      lattice_analytic_expansion_interval: 20
      lattice_analytic_expansion_sample_distance: 0.05
      # 0.0 means half a heading bin.
      lattice_goal_heading_tolerance: 0.0
      # Collision-checked Reeds-Shepp shortcuts; rejected shortcuts leave the
      # original lattice segment chain untouched.
      lattice_shortcut_smoothing_enabled: true
      lattice_shortcut_max_lookahead: 12
      lattice_max_iterations: 30000
      lattice_max_planning_time_sec: 1.5

    # This instance only exposes the footprint-validated A* corridor to the
    # Task Manager. Its path is used to choose safe intermediate goals and is
    # never sent directly to FollowPath.
    TopologyOnly:
      plugin: "forklift_nav2_plugins/OruGlobalPlanner"
      topology_only: true
      allow_unknown: true
      use_diagonal: true
      prevent_corner_cutting: true
      use_footprint_collision_check: true
      footprint_collision_cost_threshold: 254
      lethal_cost_threshold: 254
      route_guidance_enabled: true
      route_guidance_file: "/workspace/src/forklift_nav2_demo/config/warehouse_route_guidance.csv"
      route_guidance_influence_width_m: 2.0
      route_guidance_off_route_cost_multiplier: 0.60
      pallet_keepout_enabled: true
      pallet_keepout_pose_topic: "/forklift/pallet_approach/exemption_pose"
      pallet_exemption_active_topic: "/forklift/pallet_approach/exemption_active"
      pallet_keepout_timeout_sec: 0.5
      pallet_keepout_length_m: 1.80
      pallet_keepout_width_m: 1.60
      pallet_keepout_padding_m: 0.10
      cost_travel_multiplier: 2.0
      # Topology-only is never executed directly. A lower soft inflation cost
      # lets it discover the only narrow-but-nonlethal doorway corridor.
      footprint_cost_travel_multiplier: 10.0
      unknown_cost_penalty: 5.0
      start_tolerance: 1.2
      goal_tolerance: 1.5
      max_iterations: 0
      astar_path_smoothing_enabled: true
      astar_shortcut_max_lookahead: 400
      astar_shortcut_cost_threshold: 254
      astar_goal_endpoint_tolerance: 0.28
      topology_search_resolution_m: 0.50
      # The coarse topology planner normally completes in about two seconds;
      # do not allow an unavailable corridor to hold the task indefinitely.
      planner_total_timeout_sec: 5.0
      use_final_approach_orientation: false
      use_lattice_planner: false

    # This planner retains TopologyOnly's fast 0.50 m connectivity search but
    # turns its result into one fully footprint-validated FollowPath. It emits
    # explicit pivot samples only at non-driveable corners, so ordinary anchor
    # points are no longer physical stop-and-restart points.
    TopologyContinuous:
      plugin: "forklift_nav2_plugins/OruGlobalPlanner"
      topology_only: true
      topology_emit_segmented_path: true
      allow_unknown: true
      use_diagonal: true
      prevent_corner_cutting: true
      use_footprint_collision_check: true
      footprint_collision_cost_threshold: 254
      lethal_cost_threshold: 254
      route_guidance_enabled: true
      route_guidance_file: "/workspace/src/forklift_nav2_demo/config/warehouse_route_guidance.csv"
      route_guidance_influence_width_m: 2.0
      route_guidance_off_route_cost_multiplier: 0.60
      pallet_keepout_enabled: true
      pallet_keepout_pose_topic: "/forklift/pallet_approach/exemption_pose"
      pallet_exemption_active_topic: "/forklift/pallet_approach/exemption_active"
      pallet_keepout_timeout_sec: 0.5
      pallet_keepout_length_m: 1.80
      pallet_keepout_width_m: 1.60
      pallet_keepout_padding_m: 0.10
      cost_travel_multiplier: 2.0
      footprint_cost_travel_multiplier: 10.0
      unknown_cost_penalty: 5.0
      start_tolerance: 1.2
      goal_tolerance: 1.5
      max_iterations: 0
      astar_path_smoothing_enabled: true
      astar_shortcut_max_lookahead: 400
      astar_shortcut_cost_threshold: 254
      astar_bspline_sample_spacing: 0.05
      astar_segmented_pivot_threshold: 0.15
      astar_pivot_collision_sample_angle: 0.0872664626
      astar_goal_endpoint_tolerance: 0.28
      topology_search_resolution_m: 0.50
      planner_total_timeout_sec: 5.0
      use_final_approach_orientation: false
      use_lattice_planner: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    loop_rate: 2000
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
