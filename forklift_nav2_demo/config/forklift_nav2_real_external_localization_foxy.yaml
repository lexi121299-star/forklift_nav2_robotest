controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "general_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      # A maximum-angle pivot plus steering return can legitimately exceed the
      # default window without translating 0.2 m.
      movement_time_allowance: 40.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Match the controller terminal tolerance. The 2026-08-27 run consumed
      # its path at 0.281 m, then replanned a needless 96 degree pivot for the
      # final few centimetres.
      xy_goal_tolerance: 0.30
      # Production pickup/navigation goals are position goals. Do not turn the
      # steering through large angles after the vehicle reaches the target point.
      yaw_goal_tolerance: 3.141592653589793

    # Forklift MPC controller parameters
    FollowPath:
      plugin: "forklift_nav2_plugins/ForkliftMpcController"
      # 2MKC20M30LV205 drawing: drive axle to support/steering axle is 1.400 m.
      wheel_base: 1.4
      # The latest straight-line run tracked 0.45 m/s cleanly. Raise the
      # cruise limit slightly while keeping the existing curve/obstacle limits.
      max_velocity: 0.47
      min_velocity: 0.06
      max_reverse_velocity: 0.15
      max_steering_angle: 1.5707963267948966
      # computeVelocityCommands runs at 10 Hz while the prediction step is
      # 0.2 s. A 0.15 rad/s model limit bounds successive real commands to
      # roughly 0.03 rad and reduces delayed left/right over-correction.
      max_steering_angle_velocity: 0.15
      max_acceleration: 0.5
      max_angular_velocity: 0.8
      allow_pivot_turn: true
      pivot_steering_angle: 1.5707963267948966
      pivot_steering_tolerance: 0.03
      pivot_turn_radius: 0.6
      # Real vehicle base_link is defined at the drive/rear axle center.
      rear_axle_x_offset: 0.0
      # Vehicle-interface odometry now corrects yaw independently. Keep pivot
      # commands in the same yaw convention as the controller and global pose.
      invert_pivot_yaw_direction: false
      pivot_velocity: 0.12
      pivot_yaw_tolerance: 0.05
      pivot_stop_velocity_threshold: 0.02
      # Capture the planned pivot despite normal real-vehicle lateral tracking
      # error. In the 2026-08-28 14:29 run the closest approach was 0.315 m, so
      # the old 0.20 m threshold was missed and the vehicle drove past it.
      pivot_activation_distance: 0.35
      # Keep the pivot continuous. Final-speed reduction and the post-pivot
      # steering-return hold still protect against yaw overshoot.
      pivot_step_enabled: false
      pivot_step_angle: 0.3490658503988659
      pivot_step_hold_duration_sec: 0.2
      pivot_step_yaw_tolerance: 0.035
      pivot_wrong_direction_tolerance: 0.08
      # Reduce drive speed for the final segment to limit yaw overshoot.
      pivot_final_slowdown_angle: 0.3490658503988659
      pivot_final_velocity: 0.06
      # Pivot completion is latched before steering return, so yaw jitter cannot
      # command another +/-90 degree turn. Keep the extra stop short; steering
      # return already provides the main settling time.
      post_pivot_hold_duration_sec: 0.3
      post_pivot_slowdown_duration_sec: 2.0
      post_pivot_initial_max_speed: 0.12
      # A new goal can arrive with steering left over from a failed route.
      # Recenter while stopped before allowing the MPC to drive.
      new_goal_steering_settle_enabled: true
      new_goal_steering_tolerance: 0.08
      new_goal_steering_hold_duration_sec: 0.2
      horizon_time: 1.8
      time_step: 0.2
      lookahead_distance: 1.8
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 3.141592653589793
      transform_tolerance: 0.2
      terminal_slowdown_distance: 0.6
      # If the preview cursor reaches the final sample a few centimetres early,
      # keep creeping toward the goal instead of holding zero forever.
      terminal_approach_enabled: true
      terminal_approach_max_speed: 0.06
      terminal_approach_max_distance: 0.30
      terminal_approach_heading_tolerance: 0.35
      # Terminal latch must be no looser than the controller's own terminal
      # tolerance.  A 0.25 m latch can stop FollowPath before Nav2 observes the
      # goal as reached, leaving the action active and turning later goals into
      # preemption requests against a controller that is still latched.
      goal_latch_enabled: true
      goal_latch_xy_tolerance: 0.30
      goal_latch_yaw_tolerance: 3.141592653589793
      velocity_samples: 8
      steering_samples: 11
      preview_window_points: 15
      allow_reverse: true
      use_mpc_solver: true
      use_collision_check: true
      allow_unknown: true
      preprocess_path: true
      respect_reverse_path_orientation: true
      trajectory_resample_spacing: 0.10
      trajectory_smoothing_iterations: 1
      trajectory_smoothing_corner_cut_ratio: 0.25
      sharp_turn_warning_angle: 0.7853981633974483
      minimum_turning_radius: 0.60
      curvature_slowdown_enabled: true
      curvature_slowdown_lateral_accel: 0.12
      min_curvature_speed: 0.08
      # Reduce speed continuously through large turns. The old binary heading
      # threshold could jump directly from 0.06 to 0.47 m/s while the steering
      # wheel was still near its limit, causing the post-turn oscillation seen
      # in the 2026-08-21 16:01 test.
      heading_slowdown_threshold: 0.35
      heading_slowdown_full_error: 0.60
      heading_alignment_max_speed: 0.06
      steering_slowdown_enabled: true
      steering_slowdown_start_angle: 0.25
      steering_slowdown_full_angle: 0.75
      steering_slowdown_max_speed: 0.10
      max_path_deviation: 0.75
      candidate_score_abort_ratio: 4.0
      candidate_score_abort_margin: 100.0
      candidate_score_abort_cycles: 5
      safety_gate_enabled: true
      safety_emergency_stop_active: false
      safety_stop_distance: 0.75
      safety_slowdown_distance: 1.50
      safety_min_speed: 0.05
      safety_sample_spacing: 0.10
      # The global planner penalizes inflation touched by the complete footprint
      # and rejects lethal cost 254. At execution time, treat cost 253 as a
      # clearance warning rather than a physical collision so a vehicle already
      # touching that band can follow the validated escape route. Lethal cost
      # 254, unknown space, and the full footprint prediction remain blocked by
      # both the MPC controller and the independent gate.
      safety_collision_cost_threshold: 254
      collision_cost_threshold: 254
      # Task Manager activates this heartbeat only near the selected pallet.
      # While active, allow the MPC trajectory through cost 253 inflation;
      # lethal cost 254 remains blocked and the independent Safety Gate still
      # validates the selected pallet rectangle.
      pallet_exemption_enabled: true
      pallet_exemption_active_topic: "/forklift/pallet_approach/exemption_active"
      pallet_exemption_timeout_sec: 0.5
      pallet_exemption_cost_threshold: 254
      path_distance_weight: 6.0
      local_goal_weight: 14.0
      global_goal_weight: 2.0
      heading_weight: 5.0
      obstacle_weight: 12.0
      smoothness_weight: 4.0
      # Penalize rapid absolute steering target changes. The controller also
      # uses measured steering feedback below, so this damps corrections based
      # on what the steering actuator has actually reached.
      steering_change_weight: 60.0
      velocity_reward_weight: 1.2
      publish_control_cmd: true
      control_cmd_topic: "/forklift/control_cmd_raw"
      control_cmd_accel_time: 0.3
      control_cmd_decel_time: 0.3
      # Real-vehicle steering is position-controlled and has visible lag. Use
      # the measured angle instead of treating the previous command as reached.
      use_steering_feedback: true
      steering_feedback_topic: "/forklift/vehicle_state"
      steering_feedback_timeout_sec: 0.5

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      # Real vehicle: keep the rolling local costmap and controller pose in the
      # continuous odom frame. The external localization stack owns map -> odom;
      # the global planner remains in map. This prevents localization corrections
      # from jumping local control.
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      transform_tolerance: 0.5
      # 2MKC20M30LV205 envelope in base_link: drive axle at x=0, forks toward
      # -X. Axle-to-fork-tip=0.370+1.220=1.590 m; rear extent=1.709 m.
      footprint: "[[1.709, 0.610], [1.709, -0.610], [-1.590, -0.610], [-1.590, 0.610]]"
      footprint_padding: 0.05
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5
        cost_scaling_factor: 5.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: false
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # Match the local costmap and safety gate footprint. Do not use the old
      # small global footprint, otherwise the planner may route too close to racks.
      footprint: "[[1.709, 0.610], [1.709, -0.610], [-1.590, -0.610], [-1.590, 0.610]]"
      footprint_padding: 0.05
      resolution: 0.05
      track_unknown_space: true
      # obstacle_layer added so the global planner avoids real obstacles that are
      # not in the static "clean" map (sensed via /scan at plan time). Order keeps
      # inflation last. Still plan-once: only obstacles visible when the goal is
      # sent (within the laser range below) are routed around.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: True
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 1.0
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: false
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/workspace/map3.yaml"

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "forklift_nav2_plugins/OruGlobalPlanner"
      allow_unknown: true
      use_diagonal: true
      prevent_corner_cutting: true
      use_footprint_collision_check: true
      # Full-footprint collision checks distinguish the inflation warning band
      # (253) from a physical lethal obstacle (254). This lets a vehicle already
      # inside the warning band pivot/leave when its swept body does not touch a
      # lethal cell, matching the controller and independent Safety Gate.
      footprint_collision_cost_threshold: 254
      lethal_cost_threshold: 254
      cost_travel_multiplier: 2.0
      # Penalize the highest inflation cost touched by the complete footprint,
      # not only the base_link center cell. This moves A* away from racks while
      # keeping cost 253 traversable when no wider route exists.
      footprint_cost_travel_multiplier: 10.0
      unknown_cost_penalty: 5.0
      start_tolerance: 1.2
      goal_tolerance: 1.5
      max_iterations: 0
      # Remove 0.05 m grid zigzags only when the complete straight segment is
      # traversable for the configured forklift footprint.
      astar_path_smoothing_enabled: true
      astar_shortcut_max_lookahead: 400
      # The complete padded footprint is checked at every sample, so cost 253
      # may be used as clearance while lethal cost 254 remains forbidden.
      astar_shortcut_cost_threshold: 254
      # Once the vehicle has left a constrained start, do not let line-of-sight
      # simplification pull the route back through the inscribed inflation band.
      astar_preferred_footprint_cost_threshold: 253
      astar_start_clearance_relax_distance: 1.25
      # Convert the sparse A* anchors into a continuous-curvature path. The
      # first tangent follows the measured vehicle yaw, so an A* corner cannot
      # be mistaken for a +/-90 degree pivot command by the controller.
      astar_bspline_smoothing_enabled: true
      astar_bspline_sample_spacing: 0.05
      astar_bspline_min_turning_radius: 0.60
      astar_bspline_start_tangent_distance: 1.20
      # If a sparse shortcut's B-spline cuts into a rack, progressively retain
      # more collision-free A* anchors before declaring the route impossible.
      astar_bspline_retry_count: 8
      # A large start-heading mismatch is an explicit stop-pivot-go maneuver,
      # not a high-curvature road corner. The complete rotating footprint is
      # checked before the two same-position yaw poses are emitted.
      astar_start_pivot_enabled: true
      astar_start_pivot_threshold: 0.7853981634
      astar_pivot_collision_sample_angle: 0.0872664626
      # A valid grid route must not be discarded only because one global
      # B-spline leaves its free-space corridor. Fall back to validated straight
      # motion blocks joined by explicit, swept-footprint-checked pivots.
      astar_segmented_fallback_enabled: true
      # Prefer validated straight motion blocks joined by explicit pivots on
      # the real vehicle. This avoids spending seconds on global B-spline and
      # departure retries for routes that are naturally segmented.
      astar_prefer_segmented_path: true
      astar_segmented_pivot_threshold: 0.15
      # Remove only a sharp terminal dogleg after the path is already inside
      # the 0.30 m controller goal tolerance. Straight final approaches still
      # run to the selected goal, while tiny endpoint pivots are avoided.
      astar_goal_endpoint_tolerance: 0.28
      # If the current footprint cannot rotate safely, first drive straight in
      # the measured vehicle heading and retry A* from an open pivot staging
      # pose. This supports multi-turn routes around a nearby rack or pillar.
      astar_departure_fallback_enabled: true
      astar_departure_min_distance: 0.50
      astar_departure_max_distance: 5.00
      astar_departure_step_distance: 0.25
      # Keep the final path heading aligned with the approach segment. RViz goal
      # yaw is intentionally ignored so reaching the point cannot trigger a
      # large terminal steering/pivot maneuver.
      use_final_approach_orientation: false
      use_lattice_planner: false
      # v1 fail-safe: when the kinodynamic lattice search finds no path, fail cleanly
      # (PlannerException) instead of handing a holonomic 2D-A* path to the forklift
      # controller. A* ignores heading/kinematics, so the controller could not track it
      # and the vehicle diverged to the wrong corner. Re-routing is deferred to P10; v1
      # runs fixed, pre-validated routes and stops/aborts safely on planning failure.
      lattice_fallback_to_astar: true
      lattice_heading_bins: 16
      # This is the kinodynamic primitive step length in meters, not the map
      # resolution. Keep 0.20 m with 0.05 m maps unless validation shows it is
      # too coarse for a specific aisle geometry.
      lattice_step_distance: 0.20
      lattice_arc_radius: 0.60
      # Multi-curvature catalog. The tight/default/wide radii all terminate on
      # the configured heading bins; the smallest radius is also used by the
      # Reeds-Shepp analytic expansion.
      lattice_arc_radii: [0.45, 0.60, 0.90]
      lattice_arc_angle: 0.3926990817
      lattice_primitive_samples: 5
      lattice_reverse_enabled: true
      lattice_goal_tolerance: 0.25
      lattice_turn_cost_multiplier: 0.25
      lattice_obstacle_cost_multiplier: 1.0
      lattice_goal_heading_cost_multiplier: 0.25
      lattice_reverse_cost_multiplier: 3.0
      lattice_gear_switch_cost: 4.0
      lattice_reverse_requires_goal_behind: true
      lattice_reverse_goal_behind_margin: 0.05
      lattice_pivot_enabled: true
      lattice_pivot_angle: 0.3926990817
      lattice_pivot_turn_cost: 2.0
      lattice_rear_axle_x_offset: 0.0
      # Near the goal with a large remaining heading error, fix heading by pivot only
      # and suppress reverse so terminal nudges do not destabilise the controller.
      lattice_pivot_terminal_radius: 0.6
      lattice_pivot_terminal_heading: 0.7853981634  # pi/4 = 45 deg
      # Reeds-Shepp goal shot. Every sample still passes costmap + footprint checks.
      lattice_analytic_expansion_enabled: true
      lattice_analytic_expansion_radius: 3.0
      lattice_analytic_expansion_interval: 20
      lattice_analytic_expansion_sample_distance: 0.05
      # 0.0 means half a heading bin.
      lattice_goal_heading_tolerance: 0.0
      # Collision-checked Reeds-Shepp shortcuts; rejected shortcuts leave the
      # original lattice segment chain untouched.
      lattice_shortcut_smoothing_enabled: true
      lattice_shortcut_max_lookahead: 12
      lattice_max_iterations: 250000

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: false

